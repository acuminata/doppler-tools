#yaml-language-server: $schema=https://www.schemastore.org/github-action.json

name: Create Release Tag

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Doppler CLI release version like 3.77.1"
        required: true
        type: string


concurrency:
  group: create-release-tag
  cancel-in-progress: false

jobs:
  release-tag:
    name: Create new release tag
    runs-on: ubuntu-26.04
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v7.0.1
        with:
          ref: ${{ github.event.repository.default_branch }}
          token: ${{ secrets.GH_PAT_TOKEN }}

      - name: Validate semver tag
        env:
          VERSION: ${{ inputs.version }}
        shell: bash
        run: |
          set -euo pipefail
          SEMVER_REGEX='^(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)(-((0|[1-9][0-9]*|[0-9]*[A-Za-z-][0-9A-Za-z-]*)(\.(0|[1-9][0-9]*|[0-9]*[A-Za-z-][0-9A-Za-z-]*))*))?$'
          
          if [[ ! "$VERSION" =~ $SEMVER_REGEX ]]; then
            echo "::error::Invalid SemVer version: $VERSION"
            echo "Expected: MAJOR.MINOR.PATCH[-PRERELEASE]"
            exit 1
          fi

      - name: Ensure tag does not exist
        env:
          VERSION: ${{ inputs.version }}
        shell: bash
        run: |
          set -euo pipefail
          
          TAG="v${VERSION}"
          
          set +e
          git ls-remote --exit-code --tags origin "refs/tags/${TAG}" > /dev/null;
          STATUS=$?
          set -e
          
          if [[ "$STATUS" -eq 0 ]]; then
            echo "::error::Tag ${TAG} already exists"
            exit 1
          elif [[ "$STATUS" -ne 2 ]]; then
            echo "::error::Failed to check remote tag (git exit code ${STATUS})"
            exit 1
          fi  

      - name: Create and push tag
        env:
          VERSION: ${{ inputs.version }}
        run: |
          TAG="v${VERSION}"
          
          git config --global user.name "github-actions[bot]"
          git config --global user.email "41898282+github-actions[bot]@users.noreply.github.com"
          
          git tag "${TAG}" 
          git push origin "${TAG}"